services:
    # Application server: FrankenPHP (Caddy + PHP-ZTS) in worker mode.
    # Serves the Symfony app directly on :8080 — no Nginx, no PHP-FPM, no Unit.
    devkit_lti1p3_app:
        container_name: devkit_lti1p3_app
        build:
            context: .
            dockerfile: docker/frankenphp/Dockerfile
        networks:
            devkit_lti1p3_network:
                aliases:
                    - devkit-lti1p3.localhost
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.devkit_lti1p3.rule=Host(`devkit-lti1p3.localhost`)'
            - 'traefik.http.routers.devkit_lti1p3.entrypoints=web'
            - 'traefik.http.services.devkit_lti1p3.loadbalancer.server.port=8080'
        expose:
            - 8080
        ports:
            # direct access: http://localhost:8080 (documented; use the Traefik
            # host above for flows depending on APP_HOST URL generation)
            - "8080:8080"
        environment:
            WORKER_NUM: ${WORKER_NUM:-1}
            FRANKENPHP_LOOP_MAX: ${FRANKENPHP_LOOP_MAX:-500}
        depends_on:
            devkit_lti1p3_redis:
                condition: service_started
        volumes:
            - .:/app:cached
            - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile:ro
            - ./docker/frankenphp/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
        tmpfs:
            # writable cache/log/session dir for the www-data container user
            # (ephemeral per run; keeps the host checkout untouched)
            - /app/var
        working_dir: /app

    devkit_lti1p3_traefik:
        container_name: devkit_lti1p3_traefik
        # v2.4 (previously pinned) cannot speak to modern Docker Engine APIs
        # (client 1.24 < min 1.40) — v2.11 keeps the same label schema
        image: traefik:v2.11
        command:
            - '--api.insecure=true'
            - '--providers.docker=true'
            - '--providers.docker.exposedbydefault=false'
            - '--entrypoints.web.address=:80'
        networks:
            - devkit_lti1p3_network
        ports:
            - 80:80
            # traefik dashboard (app itself is on :8080)
            - 8090:8080
        volumes:
            - '/var/run/docker.sock:/var/run/docker.sock:ro'

    devkit_lti1p3_redis:
        container_name: devkit_lti1p3_redis
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        hostname: devkit_lti1p3_redis
        networks:
            - devkit_lti1p3_network
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
        volumes:
            - devkit_lti1p3_redis_volume:/data

    devkit_lti1p3_redis_commander:
        container_name: devkit_lti1p3_redis_commander
        image: rediscommander/redis-commander:latest
        hostname: devkit_lti1p3_redis_commander
        networks:
            - devkit_lti1p3_network
        ports:
            - "8081:8081"
        expose:
            - 8081
        environment:
            - REDIS_HOSTS=local:devkit_lti1p3_redis:6379

volumes:
    devkit_lti1p3_redis_volume:
        driver: local

networks:
    devkit_lti1p3_network:
        driver: bridge
