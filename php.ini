; hard cap to keep total under your 10s SLO
max_execution_time=9

; never leak engine errors into responses (container logs carry them)
display_errors=Off
log_errors=On

; Symfony 5.4 code on PHP 8.4 emits implicit-nullable deprecations; they carry
; no actionable information for operators and drown out real errors in logs
error_reporting=E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

; opcache preloading is intentionally NOT enabled on this runtime:
; opcache.preload + FrankenPHP ZTS worker threads corrupt the engine heap
; ("zend_mm_heap corrupted", core functions undefined) — measured on
; dunglas/frankenphp:1.13.2-php8.4-bookworm.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
realpath_cache_size=4096K
realpath_cache_ttl=600

; sensible defaults
expose_php=0
memory_limit=512M
post_max_size=32M
upload_max_filesize=32M
opcache.enable=1
opcache.jit=0