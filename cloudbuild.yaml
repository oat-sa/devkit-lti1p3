steps:
  # Step 0: Cancel previous concurrent builds
  - id: cancel-previous-builds
    name: europe-west1-docker.pkg.dev/tao-artefacts/cicd-tools/cancel-previous-builds:v1
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BUILD_ID=$BUILD_ID'
      - 'BUILD_REGION=$LOCATION'
      - 'DRY_RUN=false'

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        '--cache-from',
        'europe-west1-docker.pkg.dev/tao-artefacts/devkit/lti-devkit:master',
        "-t",
        "europe-west1-docker.pkg.dev/tao-artefacts/devkit/lti-devkit:$COMMIT_SHA",
        "-t",
        "europe-west1-docker.pkg.dev/tao-artefacts/devkit/lti-devkit:${_BRANCH_NAME}",
        -f,
        "./docker/frankenphp/Dockerfile",
        ".",
      ]
images:
  - "europe-west1-docker.pkg.dev/tao-artefacts/devkit/lti-devkit:$COMMIT_SHA"
  - 'europe-west1-docker.pkg.dev/tao-artefacts/devkit/lti-devkit:${_BRANCH_NAME}'

substitutions:
  _BRANCH_NAME: ${BRANCH_NAME//\//-}
options:
  machineType: E2_HIGHCPU_32
  dynamic_substitutions: true
